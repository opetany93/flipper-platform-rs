[package]
name = "flipper-platform"
version = "0.2.0"
edition = "2024"
rust-version = "1.85.0"
description = "Safe, idiomatic Rust abstractions over the Flipper Zero firmware"
license = "MIT OR Apache-2.0"
repository = "https://github.com/opetany93/flipper-platform-rs"
keywords = ["embedded", "flipperzero", "flipper", "hal", "platform"]
categories = ["embedded", "no-std", "hardware-support"]
include = ["src/**", "fonts/*.bin", "fonts/LICENSE.md", "README.md", "LICENSE-*"]

[package.metadata.docs.rs]
default-target = "thumbv7em-none-eabihf"
targets = []

[dependencies]
flipperzero = "0.16.0"
flipperzero-sys = "0.16.0"
